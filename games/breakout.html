<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Breakout</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas { display: block; border-radius: 4px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2, LEVELUP: 3 };
const BRICK_ROWS = 5;
const BRICK_COLS = 10;
const BRICK_PAD = 4;
const BRICK_TOP = 60;
const BALL_RADIUS = 6;
const PADDLE_HEIGHT = 14;
const BASE_BALL_SPEED = 5;
const SPEED_INCREMENT = 0.4;
const PARTICLE_COUNT = 12;

const BRICK_COLORS = ['#ff006e', '#ff4d6d', '#ff8500', '#ffbe0b', '#00f5d4'];
const GLOW_COLORS = ['#ff006e88', '#ff4d6d88', '#ff850088', '#ffbe0b88', '#00f5d488'];

let W, H, scale;
let state, score, lives, level;
let ball, paddle, bricks, particles;
let mouseX;
let animFrame;
let levelUpTimer;

function resize() {
  const maxW = 600, maxH = 800;
  const aspect = maxW / maxH;
  let w = window.innerWidth;
  let h = window.innerHeight;
  if (w / h > aspect) {
    H = Math.min(h, maxH);
    W = H * aspect;
  } else {
    W = Math.min(w, maxW);
    H = W / aspect;
  }
  scale = W / maxW;
  canvas.width = W;
  canvas.height = H;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
}

function s(v) { return v * scale; }

function initBricks() {
  bricks = [];
  const bw = (600 - BRICK_PAD * (BRICK_COLS + 1)) / BRICK_COLS;
  const bh = 22;
  for (let r = 0; r < BRICK_ROWS; r++) {
    for (let c = 0; c < BRICK_COLS; c++) {
      bricks.push({
        x: BRICK_PAD + c * (bw + BRICK_PAD),
        y: BRICK_TOP + r * (bh + BRICK_PAD),
        w: bw,
        h: bh,
        color: BRICK_COLORS[r],
        glow: GLOW_COLORS[r],
        alive: true,
        points: (BRICK_ROWS - r) * 10
      });
    }
  }
}

function resetBall() {
  const speed = BASE_BALL_SPEED + (level - 1) * SPEED_INCREMENT;
  const angle = -Math.PI / 4 - Math.random() * Math.PI / 2;
  ball = {
    x: 300,
    y: 600,
    dx: Math.cos(angle) * speed,
    dy: Math.sin(angle) * speed,
    speed: speed
  };
}

function initGame() {
  score = 0;
  lives = 3;
  level = 1;
  paddle = { x: 250, y: 750, w: 100, h: PADDLE_HEIGHT };
  particles = [];
  initBricks();
  resetBall();
  mouseX = 300;
}

function spawnParticles(x, y, color) {
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    particles.push({
      x, y,
      dx: Math.cos(angle) * speed,
      dy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.02 + Math.random() * 0.03,
      size: 2 + Math.random() * 3,
      color
    });
  }
}

function drawRoundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawBricks() {
  bricks.forEach(b => {
    if (!b.alive) return;
    ctx.save();
    ctx.shadowColor = b.glow;
    ctx.shadowBlur = s(8);
    ctx.fillStyle = b.color;
    drawRoundRect(s(b.x), s(b.y), s(b.w), s(b.h), s(3));
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    drawRoundRect(s(b.x), s(b.y), s(b.w), s(b.h / 2), s(3));
    ctx.fill();
  });
}

function drawPaddle() {
  const grad = ctx.createLinearGradient(s(paddle.x), 0, s(paddle.x + paddle.w), 0);
  grad.addColorStop(0, '#00f5d4');
  grad.addColorStop(1, '#7b2ff7');
  ctx.save();
  ctx.shadowColor = '#00f5d488';
  ctx.shadowBlur = s(12);
  ctx.fillStyle = grad;
  drawRoundRect(s(paddle.x), s(paddle.y), s(paddle.w), s(paddle.h), s(7));
  ctx.fill();
  ctx.restore();
}

function drawBall() {
  ctx.save();
  ctx.shadowColor = '#ffffff88';
  ctx.shadowBlur = s(10);
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(s(ball.x), s(ball.y), s(BALL_RADIUS), 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(s(p.x - p.size / 2), s(p.y - p.size / 2), s(p.size), s(p.size));
  });
  ctx.globalAlpha = 1;
}

function drawHUD() {
  ctx.fillStyle = '#e0e0e0';
  ctx.font = `bold ${s(16)}px 'Segoe UI', system-ui, sans-serif`;
  ctx.textAlign = 'left';
  ctx.fillText('SCORE: ' + score, s(12), s(28));
  ctx.textAlign = 'center';
  ctx.fillText('LEVEL ' + level, s(300), s(28));
  ctx.textAlign = 'right';
  const hearts = '';
  for (let i = 0; i < lives; i++) {
    ctx.fillStyle = '#ff006e';
    ctx.beginPath();
    const hx = s(588 - i * 24);
    const hy = s(20);
    const hs = s(8);
    ctx.arc(hx - hs * 0.3, hy - hs * 0.3, hs * 0.5, 0, Math.PI * 2);
    ctx.arc(hx + hs * 0.3, hy - hs * 0.3, hs * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(hx - hs * 0.6, hy - hs * 0.1);
    ctx.lineTo(hx, hy + hs * 0.6);
    ctx.lineTo(hx + hs * 0.6, hy - hs * 0.1);
    ctx.fill();
  }
}

function drawScreen(title, subtitle, btnText) {
  ctx.fillStyle = 'rgba(26, 26, 46, 0.85)';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.shadowColor = '#7b2ff7';
  ctx.shadowBlur = s(30);
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${s(52)}px 'Segoe UI', system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(title, s(300), s(300));
  ctx.restore();

  if (subtitle) {
    ctx.fillStyle = '#aaa';
    ctx.font = `${s(20)}px 'Segoe UI', system-ui, sans-serif`;
    ctx.fillText(subtitle, s(300), s(350));
  }

  ctx.save();
  ctx.shadowColor = '#00f5d488';
  ctx.shadowBlur = s(15);
  const bx = s(220), by = s(400), bw = s(160), bh = s(50);
  const grad = ctx.createLinearGradient(bx, by, bx + bw, by);
  grad.addColorStop(0, '#00f5d4');
  grad.addColorStop(1, '#7b2ff7');
  ctx.fillStyle = grad;
  drawRoundRect(bx, by, bw, bh, s(25));
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = '#fff';
  ctx.font = `bold ${s(20)}px 'Segoe UI', system-ui, sans-serif`;
  ctx.fillText(btnText, s(300), s(432));
}

function isButtonClick(cx, cy) {
  const bx = 220, by = 400, bw = 160, bh = 50;
  const lx = cx / scale;
  const ly = cy / scale;
  return lx >= bx && lx <= bx + bw && ly >= by && ly <= by + bh;
}

function update() {
  paddle.x = mouseX / scale - paddle.w / 2;
  paddle.x = Math.max(0, Math.min(600 - paddle.w, paddle.x));

  ball.x += ball.dx;
  ball.y += ball.dy;

  if (ball.x - BALL_RADIUS <= 0) {
    ball.x = BALL_RADIUS;
    ball.dx = Math.abs(ball.dx);
  }
  if (ball.x + BALL_RADIUS >= 600) {
    ball.x = 600 - BALL_RADIUS;
    ball.dx = -Math.abs(ball.dx);
  }
  if (ball.y - BALL_RADIUS <= 40) {
    ball.y = 40 + BALL_RADIUS;
    ball.dy = Math.abs(ball.dy);
  }

  if (
    ball.dy > 0 &&
    ball.y + BALL_RADIUS >= paddle.y &&
    ball.y + BALL_RADIUS <= paddle.y + paddle.h + ball.speed &&
    ball.x >= paddle.x - BALL_RADIUS &&
    ball.x <= paddle.x + paddle.w + BALL_RADIUS
  ) {
    ball.y = paddle.y - BALL_RADIUS;
    const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
    const angle = hit * (Math.PI / 3);
    ball.dx = Math.sin(angle) * ball.speed;
    ball.dy = -Math.cos(angle) * ball.speed;
  }

  if (ball.y - BALL_RADIUS > 800) {
    lives--;
    if (lives <= 0) {
      state = STATE.GAMEOVER;
      return;
    }
    resetBall();
  }

  let allDead = true;
  bricks.forEach(b => {
    if (!b.alive) return;
    allDead = false;

    const closestX = Math.max(b.x, Math.min(ball.x, b.x + b.w));
    const closestY = Math.max(b.y, Math.min(ball.y, b.y + b.h));
    const distX = ball.x - closestX;
    const distY = ball.y - closestY;

    if (distX * distX + distY * distY <= BALL_RADIUS * BALL_RADIUS) {
      b.alive = false;
      score += b.points;
      spawnParticles(closestX, closestY, b.color);

      const overlapX = BALL_RADIUS - Math.abs(distX);
      const overlapY = BALL_RADIUS - Math.abs(distY);

      if (overlapX < overlapY) {
        ball.dx = -ball.dx;
      } else {
        ball.dy = -ball.dy;
      }
    }
  });

  if (allDead) {
    state = STATE.LEVELUP;
    levelUpTimer = 90;
  }

  particles.forEach(p => {
    p.x += p.dx;
    p.y += p.dy;
    p.dy += 0.05;
    p.life -= p.decay;
  });
  particles = particles.filter(p => p.life > 0);
}

function render() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);

  if (state === STATE.MENU) {
    drawBricks();
    drawScreen('BREAKOUT', null, 'PLAY');
    return;
  }

  if (state === STATE.PLAYING) {
    drawBricks();
    drawPaddle();
    drawBall();
    drawParticles();
    drawHUD();
    return;
  }

  if (state === STATE.LEVELUP) {
    drawParticles();
    drawHUD();
    ctx.fillStyle = 'rgba(26, 26, 46, 0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.shadowColor = '#00f5d4';
    ctx.shadowBlur = s(20);
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${s(40)}px 'Segoe UI', system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('LEVEL ' + (level + 1), s(300), s(400));
    ctx.restore();
    return;
  }

  if (state === STATE.GAMEOVER) {
    drawParticles();
    drawScreen('GAME OVER', 'Score: ' + score, 'PLAY AGAIN');
  }
}

function gameLoop() {
  if (state === STATE.PLAYING) {
    update();
  }

  if (state === STATE.LEVELUP) {
    particles.forEach(p => {
      p.x += p.dx;
      p.y += p.dy;
      p.life -= p.decay;
    });
    particles = particles.filter(p => p.life > 0);

    levelUpTimer--;
    if (levelUpTimer <= 0) {
      level++;
      initBricks();
      resetBall();
      state = STATE.PLAYING;
    }
  }

  render();
  animFrame = requestAnimationFrame(gameLoop);
}

function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function handleStart(e) {
  e.preventDefault();
  const pos = getCanvasPos(e);
  if (state === STATE.MENU) {
    if (isButtonClick(pos.x, pos.y)) {
      initGame();
      state = STATE.PLAYING;
    }
  } else if (state === STATE.GAMEOVER) {
    if (isButtonClick(pos.x, pos.y)) {
      initGame();
      state = STATE.PLAYING;
    }
  }
  mouseX = pos.x;
}

function handleMove(e) {
  e.preventDefault();
  const pos = getCanvasPos(e);
  mouseX = pos.x;
}

canvas.addEventListener('mousedown', handleStart);
canvas.addEventListener('mousemove', handleMove);
canvas.addEventListener('touchstart', handleStart, { passive: false });
canvas.addEventListener('touchmove', handleMove, { passive: false });

window.addEventListener('resize', () => {
  resize();
  if (state === STATE.MENU) {
    initBricks();
  }
});

resize();
state = STATE.MENU;
score = 0;
lives = 3;
level = 1;
particles = [];
paddle = { x: 250, y: 750, w: 100, h: PADDLE_HEIGHT };
mouseX = 300 * scale;
initBricks();
ball = { x: 300, y: 600, dx: 0, dy: 0, speed: BASE_BALL_SPEED };
gameLoop();
</script>
</body>
</html>
