<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Whack-a-Mole</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0d0d1a; font-family:'Segoe UI',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#e2e8f0; user-select:none; touch-action:manipulation; }
  #back-link { position:fixed; top:14px; left:14px; color:rgba(255,255,255,0.7); text-decoration:none; font-size:14px; font-weight:600; background:rgba(0,0,0,0.4); padding:6px 14px; border-radius:20px; backdrop-filter:blur(6px); z-index:50; }
  #back-link:hover { color:#fff; }
  #hud { display:flex; gap:16px; margin-bottom:20px; align-items:center; }
  #hud span { background:rgba(255,255,255,0.07); padding:7px 18px; border-radius:20px; font-size:16px; font-weight:700; }
  #timer-bar-wrap { width:min(340px,88vw); height:10px; background:rgba(255,255,255,0.1); border-radius:10px; margin-bottom:22px; overflow:hidden; }
  #timer-bar { height:100%; background:linear-gradient(90deg,#7c3aed,#06b6d4); border-radius:10px; width:100%; transform-origin:left; }
  #grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .hole {
    width:clamp(80px,22vw,120px); height:clamp(80px,22vw,120px);
    background:radial-gradient(circle at 50% 70%, #1e293b, #0f172a);
    border-radius:50%; display:flex; align-items:flex-end; justify-content:center;
    overflow:hidden; cursor:pointer; position:relative;
    box-shadow:0 8px 24px rgba(0,0,0,0.5), inset 0 -4px 12px rgba(0,0,0,0.6);
    border:2px solid rgba(255,255,255,0.06);
  }
  .mole {
    font-size:clamp(2rem,9vw,3.2rem); line-height:1;
    position:absolute; bottom:-100%; transition:none;
    pointer-events:none; transform-origin:bottom center;
  }
  .score-pop { position:fixed; font-size:24px; font-weight:900; color:#fbbf24; pointer-events:none; z-index:60; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(5,5,20,0.92); z-index:40; }
  .overlay h1 { font-size:clamp(2rem,7vw,3.5rem); font-weight:900; margin-bottom:12px; }
  .overlay p { opacity:0.7; margin-bottom:30px; font-size:1.05rem; }
  .btn { background:linear-gradient(135deg,#7c3aed,#06b6d4); color:#fff; border:none; padding:14px 44px; font-size:1.1rem; font-weight:700; border-radius:40px; cursor:pointer; box-shadow:0 4px 20px rgba(124,58,237,0.4); }
  .btn:hover { transform:scale(1.06); }
  #level-badge { font-size:0.85rem; background:rgba(124,58,237,0.3); padding:3px 12px; border-radius:20px; color:#a78bfa; font-weight:700; }
</style>
</head>
<body>
<a id="back-link" href="../index.html">← Back</a>

<div class="overlay" id="start-screen">
  <h1 id="s-title">🔨 Whack-a-Mole</h1>
  <p>Hit the moles before they hide! 30 seconds.</p>
  <button class="btn" id="start-btn">Play</button>
</div>

<div class="overlay" id="go-screen" style="display:none">
  <h1>Time's Up!</h1>
  <div id="go-score" style="font-size:clamp(3rem,10vw,5rem);font-weight:900;color:#fbbf24;margin:8px 0">0</div>
  <p>points scored</p>
  <button class="btn" id="restart-btn">Play Again</button>
</div>

<div id="hud">
  <span id="score-el">⭐ 0</span>
  <span id="level-badge">Level 1</span>
  <span id="time-el">⏱ 30s</span>
</div>
<div id="timer-bar-wrap"><div id="timer-bar"></div></div>
<div id="grid"></div>

<script>
(() => {
  const grid = document.getElementById('grid');
  const scoreEl = document.getElementById('score-el');
  const timeEl = document.getElementById('time-el');
  const levelBadge = document.getElementById('level-badge');
  const goScreen = document.getElementById('go-screen');
  const goScore = document.getElementById('go-score');
  const startScreen = document.getElementById('start-screen');
  const timerBar = document.getElementById('timer-bar');

  const HOLES = 9, GAME_TIME = 30;
  let score = 0, timeLeft = GAME_TIME, level = 1, running = false;
  let holes = [], spawnInterval = null, countdownInterval = null;

  function getSpeed() { return Math.max(600, 1400 - level * 120); }
  function getSpawnRate() { return Math.max(500, 1200 - level * 100); }

  function buildGrid() {
    grid.innerHTML = '';
    holes = [];
    for (let i = 0; i < HOLES; i++) {
      const hole = document.createElement('div');
      hole.className = 'hole';
      const mole = document.createElement('div');
      mole.className = 'mole';
      mole.textContent = '🐭';
      hole.appendChild(mole);
      hole.addEventListener('click', () => whack(i));
      hole.addEventListener('touchstart', e => { e.preventDefault(); whack(i); }, {passive:false});
      grid.appendChild(hole);
      holes.push({ el: hole, mole, active: false, tween: null });
    }
    gsap.from(grid.children, { scale:0, opacity:0, duration:0.4, stagger:0.06, ease:'back.out(2)' });
  }

  function popMole(i) {
    const h = holes[i];
    if (h.active || !running) return;
    h.active = true;
    h.mole.style.bottom = '-100%';
    gsap.killTweensOf(h.mole);
    const dur = getSpeed() / 1000;
    h.tween = gsap.timeline()
      .to(h.mole, { bottom:'5%', duration: dur*0.35, ease:'back.out(1.5)' })
      .to(h.mole, { bottom:'-100%', duration: dur*0.35, ease:'power2.in', delay: dur*0.3,
        onComplete: () => { h.active = false; }
      });
  }

  function whack(i) {
    if (!running) return;
    const h = holes[i];
    if (!h.active) return;
    h.active = false;
    gsap.killTweensOf(h.mole);
    gsap.to(h.mole, { scale:0, bottom:'-100%', duration:0.15, ease:'power3.in', onComplete:() => gsap.set(h.mole,{scale:1}) });

    const pts = level >= 3 ? 20 : level === 2 ? 15 : 10;
    score += pts;
    scoreEl.textContent = `⭐ ${score}`;
    const newLevel = Math.floor(score / 50) + 1;
    if (newLevel > level) {
      level = newLevel; levelBadge.textContent = `Level ${level}`;
      gsap.from(levelBadge,{scale:1.5,duration:0.3,ease:'back.out(2)'});
      clearInterval(spawnInterval); startSpawning();
    }

    // score pop
    const rect = holes[i].el.getBoundingClientRect();
    const pop = document.createElement('div');
    pop.className = 'score-pop';
    pop.textContent = `+${pts}`;
    pop.style.left = (rect.left + rect.width/2) + 'px';
    pop.style.top = rect.top + 'px';
    document.body.appendChild(pop);
    gsap.fromTo(pop, {opacity:1,y:0},{opacity:0,y:-60,duration:0.8,ease:'power2.out',onComplete:()=>pop.remove()});
  }

  function startSpawning() {
    clearInterval(spawnInterval);
    spawnInterval = setInterval(() => {
      const i = Math.floor(Math.random()*HOLES);
      popMole(i);
    }, getSpawnRate());
  }

  function startGame() {
    score = 0; timeLeft = GAME_TIME; level = 1; running = true;
    scoreEl.textContent = '⭐ 0'; timeEl.textContent = `⏱ ${GAME_TIME}s`;
    levelBadge.textContent = 'Level 1';
    goScreen.style.display = 'none';
    gsap.to(startScreen, { opacity:0, duration:0.4, onComplete:()=>startScreen.style.display='none' });
    buildGrid();
    gsap.fromTo(timerBar, {scaleX:1}, {scaleX:0, duration:GAME_TIME, ease:'none'});
    startSpawning();
    countdownInterval = setInterval(() => {
      timeLeft--;
      timeEl.textContent = `⏱ ${timeLeft}s`;
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  function endGame() {
    running = false;
    clearInterval(spawnInterval); clearInterval(countdownInterval);
    holes.forEach(h => { gsap.killTweensOf(h.mole); h.active = false; gsap.set(h.mole,{bottom:'-100%'}); });
    goScore.textContent = score;
    goScreen.style.display = 'flex';
    gsap.fromTo(goScreen, {opacity:0,scale:0.85},{opacity:1,scale:1,duration:0.5,ease:'back.out(1.4)'});
  }

  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('restart-btn').addEventListener('click', startGame);
  gsap.from('#s-title', { scale:0, duration:0.7, ease:'back.out(1.7)', delay:0.2 });
  gsap.from('#start-btn', { scale:0, duration:0.5, ease:'back.out(2)', delay:0.6 });
  buildGrid();
})();
</script>
</body>
</html>
