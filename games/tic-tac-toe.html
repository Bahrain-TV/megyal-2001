<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0d0d1a; font-family:'Segoe UI',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#e2e8f0; user-select:none; overflow:hidden; }
  #back-link { position:fixed; top:14px; left:14px; color:rgba(255,255,255,0.7); text-decoration:none; font-size:14px; font-weight:600; background:rgba(0,0,0,0.4); padding:6px 14px; border-radius:20px; backdrop-filter:blur(6px); z-index:50; }
  #back-link:hover { color:#fff; }
  #status { font-size:1.4rem; font-weight:700; margin-bottom:24px; min-height:2rem; letter-spacing:0.5px; }
  #board { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .cell {
    width:clamp(80px,22vw,130px); height:clamp(80px,22vw,130px);
    background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.12);
    border-radius:14px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:clamp(2rem,8vw,3.5rem); font-weight:900;
    transition:background 0.2s, border-color 0.2s; position:relative; overflow:hidden;
  }
  .cell:hover:not(.taken) { background:rgba(124,58,237,0.12); border-color:rgba(124,58,237,0.4); }
  .cell.taken { cursor:default; }
  .cell.win { background:rgba(124,58,237,0.25); border-color:#7c3aed; }
  .cell span { display:inline-block; }
  .x-mark { color:#a78bfa; }
  .o-mark { color:#22d3ee; }
  #new-game-btn { margin-top:28px; background:linear-gradient(135deg,#7c3aed,#06b6d4); color:#fff; border:none; padding:12px 40px; font-size:1.1rem; font-weight:700; border-radius:40px; cursor:pointer; box-shadow:0 4px 20px rgba(124,58,237,0.4); }
  #new-game-btn:hover { transform:scale(1.06); }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(5,5,20,0.9); z-index:30; }
  .overlay h1 { font-size:clamp(2rem,7vw,3.5rem); font-weight:900; margin-bottom:12px; }
  .overlay p { opacity:0.7; margin-bottom:30px; font-size:1.05rem; }
  .btn { background:linear-gradient(135deg,#7c3aed,#06b6d4); color:#fff; border:none; padding:14px 44px; font-size:1.1rem; font-weight:700; border-radius:40px; cursor:pointer; box-shadow:0 4px 20px rgba(124,58,237,0.4); }
  .btn:hover { transform:scale(1.06); }
  #result-banner { position:fixed; top:-80px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,#7c3aed,#22d3ee); color:#fff; padding:14px 50px; border-radius:40px; font-size:1.4rem; font-weight:800; z-index:40; white-space:nowrap; box-shadow:0 4px 24px rgba(124,58,237,0.5); }
</style>
</head>
<body>
<a id="back-link" href="../index.html">← Back</a>
<div class="overlay" id="start-screen">
  <h1 id="s-title">❌ Tic-Tac-Toe</h1>
  <p>You are X — beat the AI!</p>
  <button class="btn" id="start-btn">Play</button>
</div>
<div id="result-banner"></div>
<div id="status">Your turn (X)</div>
<div id="board"></div>
<button id="new-game-btn">New Game</button>

<script>
(() => {
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const newGameBtn = document.getElementById('new-game-btn');
  const banner = document.getElementById('result-banner');
  const startScreen = document.getElementById('start-screen');

  let board = Array(9).fill(null);
  let playerTurn = true, gameOver = false;

  const WIN_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  function checkWinner(b) {
    for (const [a,c,d] of WIN_LINES) if (b[a] && b[a]===b[c] && b[a]===b[d]) return { winner:b[a], line:[a,c,d] };
    if (b.every(x=>x)) return { winner:'draw' };
    return null;
  }

  function aiMove(b) {
    // win
    for (const [a,c,d] of WIN_LINES) {
      const line = [b[a],b[c],b[d]];
      if (line.filter(x=>x==='O').length===2 && line.includes(null)) return [a,c,d][line.indexOf(null)];
    }
    // block
    for (const [a,c,d] of WIN_LINES) {
      const line = [b[a],b[c],b[d]];
      if (line.filter(x=>x==='X').length===2 && line.includes(null)) return [a,c,d][line.indexOf(null)];
    }
    // center
    if (!b[4]) return 4;
    // corner
    const corners = [0,2,6,8].filter(i=>!b[i]);
    if (corners.length) return corners[Math.floor(Math.random()*corners.length)];
    // any
    const empties = b.map((v,i)=>v?null:i).filter(i=>i!==null);
    return empties[Math.floor(Math.random()*empties.length)];
  }

  function renderBoard() {
    boardEl.innerHTML = '';
    board.forEach((val, i) => {
      const cell = document.createElement('div');
      cell.className = 'cell' + (val?' taken':'');
      cell.dataset.i = i;
      if (val) {
        const span = document.createElement('span');
        span.textContent = val;
        span.className = val==='X' ? 'x-mark' : 'o-mark';
        cell.appendChild(span);
        gsap.from(span, { scale:0, rotation: val==='O'?-180:0, duration:0.3, ease:'back.out(2)' });
      }
      cell.addEventListener('click', onCellClick);
      boardEl.appendChild(cell);
    });
  }

  function onCellClick(e) {
    const i = parseInt(e.currentTarget.dataset.i);
    if (!playerTurn || gameOver || board[i]) return;
    board[i] = 'X';
    renderBoard();
    const res = checkWinner(board);
    if (res) { endGame(res); return; }
    playerTurn = false;
    statusEl.textContent = 'AI is thinking…';
    setTimeout(() => {
      const move = aiMove(board);
      if (move !== undefined) { board[move] = 'O'; renderBoard(); }
      const res2 = checkWinner(board);
      if (res2) { endGame(res2); return; }
      playerTurn = true;
      statusEl.textContent = 'Your turn (X)';
    }, 400);
  }

  function endGame(res) {
    gameOver = true;
    if (res.winner === 'draw') {
      statusEl.textContent = "It's a draw!";
      showBanner("🤝 Draw!");
    } else {
      const won = res.winner === 'X';
      statusEl.textContent = won ? '🎉 You win!' : '🤖 AI wins!';
      showBanner(won ? '🎉 You Win!' : '🤖 AI Wins!');
      // highlight winning cells
      res.line.forEach(i => {
        const cell = boardEl.children[i];
        cell.classList.add('win');
        gsap.fromTo(cell, {x:0},{x:6,repeat:5,yoyo:true,duration:0.07,ease:'none'});
      });
    }
    gsap.to(newGameBtn, { scale:1.1, repeat:-1, yoyo:true, duration:0.8, ease:'sine.inOut', delay:0.5 });
  }

  function showBanner(msg) {
    banner.textContent = msg;
    gsap.fromTo(banner, { top:'-80px' }, { top:'30px', duration:0.5, ease:'back.out(1.7)' });
  }

  function newGame() {
    board = Array(9).fill(null);
    playerTurn = true; gameOver = false;
    statusEl.textContent = 'Your turn (X)';
    gsap.killTweensOf(newGameBtn); gsap.set(newGameBtn,{scale:1});
    gsap.to(banner, { top:'-80px', duration:0.3 });
    renderBoard();
    // stagger cells
    const cells = boardEl.querySelectorAll('.cell');
    gsap.from(cells, { scale:0, opacity:0, duration:0.3, stagger:0.04, ease:'back.out(2)' });
  }

  newGameBtn.addEventListener('click', newGame);

  // Start screen
  gsap.from('#s-title', { scale:0, duration:0.7, ease:'back.out(1.7)', delay:0.2 });
  gsap.from('#start-btn', { scale:0, duration:0.5, ease:'back.out(2)', delay:0.6 });
  document.getElementById('start-btn').addEventListener('click', () => {
    gsap.to(startScreen, { opacity:0, duration:0.4, onComplete:()=>{ startScreen.style.display='none'; newGame(); } });
  });

  newGame();
})();
</script>
</body>
</html>
