<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Bird</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const STATE = { MENU: 0, PLAYING: 1, DEAD: 2 };

let W, H, dpr;
let state = STATE.MENU;
let bird, pipes, score, highScore, ground, frameCount, flash;

const GRAVITY = 0.45;
const FLAP = -7.5;
const PIPE_WIDTH = 52;
const PIPE_GAP = 140;
const PIPE_SPEED = 2.5;
const GROUND_HEIGHT = 60;
const BIRD_RADIUS = 15;

function resize() {
    dpr = window.devicePixelRatio || 1;
    W = Math.min(window.innerWidth, 480);
    H = Math.min(window.innerHeight, 800);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function init() {
    bird = { x: W * 0.3, y: H * 0.4, vy: 0, rotation: 0 };
    pipes = [];
    score = 0;
    frameCount = 0;
    flash = 0;
    ground = { offset: 0 };
    highScore = parseInt(localStorage.getItem('flappyHigh') || '0');
}

function spawnPipe() {
    const minY = PIPE_GAP / 2 + 40;
    const maxY = H - GROUND_HEIGHT - PIPE_GAP / 2 - 40;
    const gapY = minY + Math.random() * (maxY - minY);
    pipes.push({ x: W + PIPE_WIDTH, gapY: gapY, scored: false });
}

function flap() {
    if (state === STATE.MENU) {
        state = STATE.PLAYING;
        bird.vy = FLAP;
    } else if (state === STATE.PLAYING) {
        bird.vy = FLAP;
    } else if (state === STATE.DEAD && frameCount > 20) {
        state = STATE.MENU;
        init();
    }
}

function collides() {
    const r = BIRD_RADIUS - 2;
    if (bird.y + r > H - GROUND_HEIGHT || bird.y - r < 0) return true;
    for (const p of pipes) {
        const topBottom = p.gapY - PIPE_GAP / 2;
        const botTop = p.gapY + PIPE_GAP / 2;
        if (bird.x + r > p.x && bird.x - r < p.x + PIPE_WIDTH) {
            if (bird.y - r < topBottom || bird.y + r > botTop) return true;
        }
    }
    return false;
}

function update() {
    frameCount++;

    if (state === STATE.PLAYING) {
        bird.vy += GRAVITY;
        bird.y += bird.vy;

        const targetRot = Math.min(Math.max(bird.vy * 0.08, -0.5), Math.PI / 2);
        bird.rotation += (targetRot - bird.rotation) * 0.15;

        ground.offset = (ground.offset + PIPE_SPEED) % 24;

        if (pipes.length === 0 || pipes[pipes.length - 1].x < W - 200) {
            spawnPipe();
        }

        for (let i = pipes.length - 1; i >= 0; i--) {
            pipes[i].x -= PIPE_SPEED;
            if (!pipes[i].scored && pipes[i].x + PIPE_WIDTH < bird.x) {
                pipes[i].scored = true;
                score++;
            }
            if (pipes[i].x + PIPE_WIDTH < -10) pipes.splice(i, 1);
        }

        if (collides()) {
            state = STATE.DEAD;
            frameCount = 0;
            flash = 1;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('flappyHigh', highScore.toString());
            }
        }
    } else if (state === STATE.MENU) {
        bird.y = H * 0.4 + Math.sin(frameCount * 0.05) * 12;
        bird.rotation = 0;
        ground.offset = (ground.offset + 1) % 24;
    }

    if (flash > 0) flash -= 0.05;
}

function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, H - GROUND_HEIGHT);
    grad.addColorStop(0, '#0f3460');
    grad.addColorStop(1, '#16213e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H - GROUND_HEIGHT);

    ctx.fillStyle = 'rgba(255,255,255,0.015)';
    for (let i = 0; i < 40; i++) {
        const sx = (i * 97.3 + frameCount * 0.1) % (W + 20) - 10;
        const sy = (i * 53.7) % (H - GROUND_HEIGHT - 100);
        ctx.beginPath();
        ctx.arc(sx, sy, 1 + (i % 3) * 0.5, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawGround() {
    ctx.fillStyle = '#2d5016';
    ctx.fillRect(0, H - GROUND_HEIGHT, W, GROUND_HEIGHT);

    ctx.fillStyle = '#3a6b1e';
    ctx.fillRect(0, H - GROUND_HEIGHT, W, 4);

    ctx.strokeStyle = '#1a3a0a';
    ctx.lineWidth = 1;
    for (let x = -ground.offset; x < W + 24; x += 24) {
        ctx.beginPath();
        ctx.moveTo(x, H - GROUND_HEIGHT + 4);
        ctx.lineTo(x + 12, H - GROUND_HEIGHT + 16);
        ctx.stroke();
    }
}

function drawPipe(p) {
    const topH = p.gapY - PIPE_GAP / 2;
    const botY = p.gapY + PIPE_GAP / 2;
    const botH = H - GROUND_HEIGHT - botY;
    const capH = 20;
    const capW = PIPE_WIDTH + 8;
    const capX = p.x - 4;

    ctx.fillStyle = '#3fb950';
    ctx.strokeStyle = '#2a7d38';
    ctx.lineWidth = 2;

    ctx.fillRect(p.x, 0, PIPE_WIDTH, topH);
    ctx.strokeRect(p.x, 0, PIPE_WIDTH, topH);

    const grad1 = ctx.createLinearGradient(p.x, 0, p.x + PIPE_WIDTH, 0);
    grad1.addColorStop(0, 'rgba(255,255,255,0.1)');
    grad1.addColorStop(0.5, 'transparent');
    grad1.addColorStop(1, 'rgba(0,0,0,0.15)');
    ctx.fillStyle = grad1;
    ctx.fillRect(p.x, 0, PIPE_WIDTH, topH);

    ctx.fillStyle = '#3fb950';
    ctx.fillRect(capX, topH - capH, capW, capH);
    ctx.strokeRect(capX, topH - capH, capW, capH);

    ctx.fillStyle = '#3fb950';
    ctx.fillRect(p.x, botY, PIPE_WIDTH, botH);
    ctx.strokeRect(p.x, botY, PIPE_WIDTH, botH);

    const grad2 = ctx.createLinearGradient(p.x, 0, p.x + PIPE_WIDTH, 0);
    grad2.addColorStop(0, 'rgba(255,255,255,0.1)');
    grad2.addColorStop(0.5, 'transparent');
    grad2.addColorStop(1, 'rgba(0,0,0,0.15)');
    ctx.fillStyle = grad2;
    ctx.fillRect(p.x, botY, PIPE_WIDTH, botH);

    ctx.fillStyle = '#3fb950';
    ctx.fillRect(capX, botY, capW, capH);
    ctx.strokeRect(capX, botY, capW, capH);
}

function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rotation);

    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(0, 0, BIRD_RADIUS, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#b8960f';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#ffec80';
    ctx.beginPath();
    ctx.arc(-3, -4, BIRD_RADIUS * 0.45, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(6, -5, 5.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(7.5, -4.5, 2.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ff6b35';
    ctx.beginPath();
    ctx.moveTo(BIRD_RADIUS - 2, -3);
    ctx.lineTo(BIRD_RADIUS + 10, 0);
    ctx.lineTo(BIRD_RADIUS - 2, 4);
    ctx.closePath();
    ctx.fill();

    const wingY = state === STATE.PLAYING ? Math.sin(frameCount * 0.4) * 5 : Math.sin(frameCount * 0.1) * 3;
    ctx.fillStyle = '#e6c200';
    ctx.beginPath();
    ctx.ellipse(-6, 4 + wingY, 10, 5, -0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function drawScore() {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.strokeText(score, W / 2, 70);
    ctx.fillText(score, W / 2, 70);
}

function drawMenu() {
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 42px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.strokeText('Flappy Bird', W / 2, H * 0.22);
    ctx.fillText('Flappy Bird', W / 2, H * 0.22);

    const pulse = 0.7 + Math.sin(frameCount * 0.06) * 0.3;
    ctx.fillStyle = `rgba(255,255,255,${pulse})`;
    ctx.font = '22px Arial, sans-serif';
    ctx.fillText('Tap to Play', W / 2, H * 0.62);

    if (highScore > 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.font = '16px Arial, sans-serif';
        ctx.fillText('Best: ' + highScore, W / 2, H * 0.70);
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, W, H);

    const panelW = 220;
    const panelH = 180;
    const px = (W - panelW) / 2;
    const py = H * 0.28;

    ctx.fillStyle = 'rgba(22,33,62,0.95)';
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(px, py, panelW, panelH, 12);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 30px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Game Over', W / 2, py + 42);

    ctx.fillStyle = '#fff';
    ctx.font = '20px Arial, sans-serif';
    ctx.fillText('Score: ' + score, W / 2, py + 85);

    ctx.fillStyle = '#ffd700';
    ctx.font = '18px Arial, sans-serif';
    ctx.fillText('Best: ' + highScore, W / 2, py + 115);

    const pulse = 0.6 + Math.sin(frameCount * 0.08) * 0.4;
    ctx.fillStyle = `rgba(255,255,255,${pulse})`;
    ctx.font = '18px Arial, sans-serif';
    ctx.fillText('Tap to Retry', W / 2, py + 155);
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    pipes.forEach(drawPipe);
    drawGround();
    drawBird();

    if (state === STATE.MENU) drawMenu();
    if (state === STATE.PLAYING) drawScore();
    if (state === STATE.DEAD) drawGameOver();

    if (flash > 0) {
        ctx.fillStyle = `rgba(255,255,255,${flash})`;
        ctx.fillRect(0, 0, W, H);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
canvas.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); flap(); } });

resize();
init();
loop();
</script>
</body>
</html>
