<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    overflow: hidden;
    background: #1a1a2e;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  canvas { display: block; }

  #ui-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  #hud {
    position: absolute;
    top: 12px; left: 12px; right: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #fff;
    font-size: 18px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }

  #hud span {
    background: rgba(0,0,0,0.35);
    padding: 6px 14px;
    border-radius: 20px;
    backdrop-filter: blur(4px);
  }

  .screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    pointer-events: auto;
    background: rgba(26, 26, 46, 0.92);
    backdrop-filter: blur(8px);
  }

  .screen.hidden { display: none; }

  .screen h1 {
    font-size: 64px;
    font-weight: 800;
    background: linear-gradient(135deg, #0ff, #39ff14);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  .screen p {
    color: rgba(255,255,255,0.6);
    font-size: 20px;
    margin-bottom: 36px;
  }

  .screen .score-display {
    font-size: 48px;
    font-weight: 700;
    color: #39ff14;
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(57,255,20,0.5);
  }

  .screen .high-score-display {
    font-size: 16px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 32px;
  }

  .btn {
    padding: 14px 48px;
    font-size: 20px;
    font-weight: 600;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    background: linear-gradient(135deg, #0ff, #39ff14);
    color: #1a1a2e;
    letter-spacing: 1px;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 24px rgba(57,255,20,0.3);
  }

  .btn:hover { transform: scale(1.05); box-shadow: 0 6px 32px rgba(57,255,20,0.5); }
  .btn:active { transform: scale(0.97); }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui-overlay">
  <div id="hud" class="hidden">
    <span id="score-hud">Score: 0</span>
    <span id="high-hud">Best: 0</span>
  </div>

  <div id="start-screen" class="screen">
    <h1>Snake</h1>
    <p>Arrow keys or swipe to move</p>
    <button class="btn" id="play-btn">Play</button>
  </div>

  <div id="gameover-screen" class="screen hidden">
    <p style="margin-bottom:8px;">Game Over</p>
    <div class="score-display" id="final-score">0</div>
    <div class="high-score-display" id="final-high">Best: 0</div>
    <button class="btn" id="retry-btn">Play Again</button>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const scoreHud = document.getElementById('score-hud');
  const highHud = document.getElementById('high-hud');
  const startScreen = document.getElementById('start-screen');
  const gameoverScreen = document.getElementById('gameover-screen');
  const finalScore = document.getElementById('final-score');
  const finalHigh = document.getElementById('final-high');

  const GRID = 20;
  const BASE_INTERVAL = 150;
  const MIN_INTERVAL = 60;
  const SPEED_STEP = 2;

  let cols, rows, cellSize;
  let snake, dir, nextDir, food, score, highScore, interval, lastTick, running, gameOver;

  highScore = parseInt(localStorage.getItem('snake_high') || '0', 10);

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    cellSize = Math.floor(Math.min(canvas.width / GRID, canvas.height / GRID));
    cols = Math.floor(canvas.width / cellSize);
    rows = Math.floor(canvas.height / cellSize);
  }

  function spawnFood() {
    let occupied = new Set(snake.map(s => s.x + ',' + s.y));
    let attempts = 0;
    do {
      food = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
      attempts++;
    } while (occupied.has(food.x + ',' + food.y) && attempts < 1000);
  }

  function reset() {
    let cx = Math.floor(cols / 2);
    let cy = Math.floor(rows / 2);
    snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    interval = BASE_INTERVAL;
    lastTick = 0;
    running = true;
    gameOver = false;
    spawnFood();
    updateHud();
  }

  function updateHud() {
    scoreHud.textContent = 'Score: ' + score;
    highHud.textContent = 'Best: ' + highScore;
  }

  function showScreen(screen) {
    startScreen.classList.add('hidden');
    gameoverScreen.classList.add('hidden');
    hud.classList.add('hidden');
    if (screen === 'start') startScreen.classList.remove('hidden');
    else if (screen === 'gameover') gameoverScreen.classList.remove('hidden');
    else if (screen === 'play') hud.classList.remove('hidden');
  }

  function startGame() {
    resize();
    reset();
    showScreen('play');
    requestAnimationFrame(loop);
  }

  function endGame() {
    running = false;
    gameOver = true;
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('snake_high', highScore);
    }
    finalScore.textContent = score;
    finalHigh.textContent = 'Best: ' + highScore;
    setTimeout(function () { showScreen('gameover'); }, 400);
  }

  function update() {
    dir = nextDir;
    let head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) return endGame();
    for (let i = 0; i < snake.length; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return endGame();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      interval = Math.max(MIN_INTERVAL, BASE_INTERVAL - score * SPEED_STEP);
      spawnFood();
      updateHud();
    } else {
      snake.pop();
    }
  }

  function draw() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    let ox = Math.floor((canvas.width - cols * cellSize) / 2);
    let oy = Math.floor((canvas.height - rows * cellSize) / 2);

    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= cols; x++) {
      ctx.beginPath();
      ctx.moveTo(ox + x * cellSize, oy);
      ctx.lineTo(ox + x * cellSize, oy + rows * cellSize);
      ctx.stroke();
    }
    for (let y = 0; y <= rows; y++) {
      ctx.beginPath();
      ctx.moveTo(ox, oy + y * cellSize);
      ctx.lineTo(ox + cols * cellSize, oy + y * cellSize);
      ctx.stroke();
    }

    let pad = 2;
    for (let i = snake.length - 1; i >= 0; i--) {
      let t = i / Math.max(snake.length - 1, 1);
      let r = Math.round(57 * (1 - t) + 0 * t);
      let g = Math.round(255 * (1 - t) + 255 * t);
      let b = Math.round(20 * (1 - t) + 255 * t);
      ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
      let radius = Math.max((cellSize - pad * 2) * 0.3, 2);
      roundRect(ctx, ox + snake[i].x * cellSize + pad, oy + snake[i].y * cellSize + pad, cellSize - pad * 2, cellSize - pad * 2, i === 0 ? radius + 1 : radius);

      if (i === 0) {
        ctx.shadowColor = 'rgba(57,255,20,0.6)';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
      } else {
        ctx.fill();
      }
    }

    ctx.fillStyle = '#ff2264';
    ctx.shadowColor = 'rgba(255,34,100,0.7)';
    ctx.shadowBlur = 12;
    let fr = (cellSize - pad * 2) * 0.35;
    ctx.beginPath();
    ctx.arc(ox + food.x * cellSize + cellSize / 2, oy + food.y * cellSize + cellSize / 2, (cellSize - pad * 2) / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }

  function loop(ts) {
    if (!running) return;
    if (ts - lastTick >= interval) {
      lastTick = ts;
      update();
      if (!running) { draw(); return; }
    }
    draw();
    requestAnimationFrame(loop);
  }

  document.getElementById('play-btn').addEventListener('click', startGame);
  document.getElementById('retry-btn').addEventListener('click', startGame);

  document.addEventListener('keydown', function (e) {
    if (!running) return;
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W':
        if (dir.y !== 1) nextDir = { x: 0, y: -1 };
        e.preventDefault();
        break;
      case 'ArrowDown': case 's': case 'S':
        if (dir.y !== -1) nextDir = { x: 0, y: 1 };
        e.preventDefault();
        break;
      case 'ArrowLeft': case 'a': case 'A':
        if (dir.x !== 1) nextDir = { x: -1, y: 0 };
        e.preventDefault();
        break;
      case 'ArrowRight': case 'd': case 'D':
        if (dir.x !== -1) nextDir = { x: 1, y: 0 };
        e.preventDefault();
        break;
    }
  });

  let touchStartX, touchStartY;
  document.addEventListener('touchstart', function (e) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  document.addEventListener('touchend', function (e) {
    if (!running) return;
    let dx = e.changedTouches[0].clientX - touchStartX;
    let dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 0 && dir.x !== -1) nextDir = { x: 1, y: 0 };
      else if (dx < 0 && dir.x !== 1) nextDir = { x: -1, y: 0 };
    } else {
      if (dy > 0 && dir.y !== -1) nextDir = { x: 0, y: 1 };
      else if (dy < 0 && dir.y !== 1) nextDir = { x: 0, y: -1 };
    }
  }, { passive: true });

  window.addEventListener('resize', function () {
    resize();
    if (!gameOver && !running) return;
    if (running) draw();
  });

  resize();
  highHud.textContent = 'Best: ' + highScore;
  showScreen('start');

  draw = (function (origDraw) {
    return function () {
      if (!snake) return;
      origDraw();
    };
  })(draw);
})();
</script>
</body>
</html>
